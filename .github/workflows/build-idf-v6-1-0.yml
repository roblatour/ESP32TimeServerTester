name: Build ESP32TimeServerTester (ESP-IDF v6.1)

on:
  push:
    branches: [ main ]
    paths:
      - '**.c'
      - '**.cc'
      - '**.cpp'
      - '**.h'
      - '**.hpp'
      - '**.in'
      - '**.cmake'
      - 'CMakeLists.txt'
      - '**/CMakeLists.txt'
      - 'sdkconfig.defaults'
      - 'config/**'
      - 'partitions.csv'
      - 'main/idf_component.yml'
      - 'main/favicon.ico'
      - '.github/workflows/build-idf-v6-1-0.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '**.c'
      - '**.cc'
      - '**.cpp'
      - '**.h'
      - '**.hpp'
      - '**.in'
      - '**.cmake'
      - 'CMakeLists.txt'
      - '**/CMakeLists.txt'
      - 'sdkconfig.defaults'
      - 'config/**'
      - 'partitions.csv'
      - 'main/idf_component.yml'
      - 'main/favicon.ico'
      - '.github/workflows/build-idf-v6-1-0.yml'
  workflow_dispatch:

jobs:
  build-v61:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Chip-revision profiles from config/, as documented in README.md.
        profile: [ esp32p4_rev_v3_1, esp32p4_rev_v3_0, esp32p4_rev_pre_v3 ]

    name: build-v61 (${{ matrix.profile }})

    steps:
    - name: Checkout Repository From Scratch
      uses: actions/checkout@v6
      with:
        submodules: 'recursive'

    - name: Setup Compiler Cache (ccache)
      uses: actions/cache@v5
      with:
        path: .ccache
        key: esp32p4-v6.1-${{ matrix.profile }}-ccache-${{ github.run_id }}
        restore-keys: |
          esp32p4-v6.1-${{ matrix.profile }}-ccache-

    - name: Clean Compile with ESP-IDF v6.1
      uses: espressif/esp-idf-ci-action@v1
      env:
        CCACHE_DIR: ${{ github.workspace }}/.ccache
      with:
        esp_idf_version: v6.1
        target: esp32p4
        command: |
          idf.py --ccache -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;config/${{ matrix.profile }}.defaults" build

    # - name: Upload Binary Artifact
    #   uses: actions/upload-artifact@v4
    #   with:
    #     name: ESP32TimeServerTester_ESP-IDF-v6.1_${{ matrix.profile }}.bin
    #     path: build/ESP32TimeServerTester.bin